# Local development stack: Postgres (system of record) + MinIO (S3-compatible blobs).
# Postgres is published on host port 15432 to avoid colliding with a local Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spend
      POSTGRES_PASSWORD: spend
      POSTGRES_DB: spend_integrity
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend -d spend_integrity"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_minio_minio
      # Browser PUT to presigned URLs (step 1c) comes from the Vite origin, not the API.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save "" --appendonly no

  # Local SMTP capture: org invites, login OTP, password reset (see scripts/dev.sh).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
  redisdata:
