[project]
name = "spend-integrity-api"
version = "0.1.0"
description = "AI Spend Integrity Platform — API (Phase 1)"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "redis>=5.0.0",
    "rq>=2.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
register-document = "app.scripts.register_document:main"
document-worker = "app.scripts.run_rq_worker:main"
seed-dev-org = "app.scripts.seed_dev_org:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
